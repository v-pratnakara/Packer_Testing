name: old 70 dyas-Export SIG Image Versions to Managed Disks

on:
  workflow_dispatch:  # Allows manual trigger

env:
  AZURE_SUBSCRIPTION_ID: "1901eaa9-e98f-49b6-ac39-b1cd55defe19"
  SOURCE_RESOURCE_GROUP: "rg-packer-acg"
  DESTINATION_RESOURCE_GROUP: "Test_VM"
  GALLERY_NAME: "AzurepackerImages"
  IMAGE_DEFINITION: "win2019dcx64"
  LOCATION: "West US"

permissions:
  id-token: write
  contents: read

jobs:
  export-sig-images:
    runs-on: self-hosted
    steps:

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      - name: Get Image Versions (Older than 70 Days)
        shell: pwsh
        run: |
          # Fetch all image versions with their published dates
          $image_versions = az sig image-version list `
            --resource-group $env:SOURCE_RESOURCE_GROUP `
            --gallery-name $env:GALLERY_NAME `
            --gallery-image-definition $env:IMAGE_DEFINITION `
            --query "[].{version:name, publishedDate:publishingProfile.publishedDate}" `
            --output json | ConvertFrom-Json

          # Get the date 70 days ago
          $date_threshold = (Get-Date).AddDays(-70)

          # Filter only versions published before this date
          $filtered_versions = $image_versions | Where-Object { 
            (Get-Date $_.publishedDate) -lt $date_threshold
          }

          if (-not $filtered_versions) {
            Write-Output "No image versions older than 70 days found."
            exit 0  # Exit successfully if nothing to process
          }

          # Extract version names and store in environment
          $version_list = $filtered_versions.version -join ","
          Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_VERSIONS=$version_list"

          Write-Output "Filtered Image Versions (Older than 70 Days):"
          $filtered_versions | ForEach-Object { Write-Output $_.version }

      - name: Create Managed Disks for Each Version
        shell: pwsh
        run: |
          # Retrieve filtered image versions from environment
          $IMAGE_VERSIONS = $env:IMAGE_VERSIONS -split ","

          foreach ($IMAGE_VERSION in $IMAGE_VERSIONS) {
            $DISK_NAME = "ManagedDisk-$($IMAGE_VERSION -replace '[^a-zA-Z0-9]', '-')"
            Write-Output "Creating Managed Disk for image version: $IMAGE_VERSION"

            az disk create `
              --resource-group $env:DESTINATION_RESOURCE_GROUP `
              --name $DISK_NAME `
              --location $env:LOCATION `
              --gallery-image-reference "/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:SOURCE_RESOURCE_GROUP/providers/Microsoft.Compute/galleries/$env:GALLERY_NAME/images/$env:IMAGE_DEFINITION/versions/$IMAGE_VERSION"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create disk for $IMAGE_VERSION"
              exit 1
            }
          }
