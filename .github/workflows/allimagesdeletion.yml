name: Imagedefs -Clean Up all Old Images in Azure Image Gallery

on:
  schedule:
    - cron: "00 16 * * *"  # Runs every day at 16:00 UTC
  workflow_dispatch:  # Allows manual execution

jobs:
  cleanup:
    name: Delete Old Image Versions
    runs-on: Linux-self-hosted  # Self-hosted runner

    env:
      IMAGE_GALLERY: "AzurepackerImages"
      RESOURCE_GROUP: "rg-packer-acg"
      KEEP_VERSIONS: 1  # Number of latest versions to keep
      IMAGE_DEFINITIONS: "linux8x64,ubuntu20x64,win2019dcx64,win2022dcx64"  # Add multiple image definitions here (comma-separated)

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      - name: Fetch and Delete Old Image Versions
        shell: pwsh
        run: |
          # Convert comma-separated list of image definitions to an array
          $imageDefinitions = $env:IMAGE_DEFINITIONS -split ","

          foreach ($imageDef in $imageDefinitions) {
            Write-Output "Processing image definition: $imageDef"
            
            # Fetch all image versions
            $imageVersions = az sig image-version list `
              --resource-group $env:RESOURCE_GROUP `
              --gallery-name $env:IMAGE_GALLERY `
              --gallery-image-definition $imageDef `
              --query "[].{version:name}" `
              --output tsv | Sort-Object
            
            Write-Output "Image Versions Found for $imageDef:"
            Write-Output "$imageVersions"
            
            $count = ($imageVersions -split "`n").Count
            Write-Output "Total versions for $imageDef: $count"

            if ($count -gt $env:KEEP_VERSIONS) {
              $deleteCount = $count - [int]$env:KEEP_VERSIONS
              $deleteVersions = ($imageVersions -split "`n") | Select-Object -First $deleteCount
              
              foreach ($version in $deleteVersions) {
                Write-Output "Deleting version: $version for $imageDef"
                az sig image-version delete `
                  --resource-group $env:RESOURCE_GROUP `
                  --gallery-name $env:IMAGE_GALLERY `
                  --gallery-image-definition $imageDef `
                  --gallery-image-version $version
              }
            } else {
              Write-Output "No old versions to delete for $imageDef."
            }
          }
