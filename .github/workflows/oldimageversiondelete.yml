name: ASG Old Images in Azure Image Gallery

on:
  schedule:
    - cron: "00 16 * * *"  # Runs every day at 16:00 UTC
  workflow_dispatch:  # Allows manual execution

jobs:
  cleanup:
    name: Delete Old Image Versions
    runs-on: Linux-self-hosted

    env:
      IMAGE_GALLERY: "AzurepackerImages"
      RESOURCE_GROUP: "rg-packer-acg"
      IMAGE_DEFINITION: "win2022dcx64"
      KEEP_VERSIONS: 0  # Number of latest versions to keep

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      - name: Fetch and Delete Old Image Versions (Bash)
        shell: bash
        run: |
          echo "Fetching image versions..."
          imageVersions=$(az sig image-version list \
            --resource-group "$RESOURCE_GROUP" \
            --gallery-name "$IMAGE_GALLERY" \
            --gallery-image-definition "$IMAGE_DEFINITION" \
            --query "[].name" \
            --output tsv | sort)

          echo "Image Versions Found:"
          echo "$imageVersions"

          count=$(echo "$imageVersions" | wc -l)
          echo "Total versions: $count"

          if [ "$count" -gt "$KEEP_VERSIONS" ]; then
            deleteCount=$((count - KEEP_VERSIONS))
            echo "Deleting $deleteCount old image(s)..."
            echo "$imageVersions" | head -n "$deleteCount" | while read -r version; do
              echo "Deleting version: $version"
              az sig image-version delete \
                --resource-group "$RESOURCE_GROUP" \
                --gallery-name "$IMAGE_GALLERY" \
                --gallery-image-definition "$IMAGE_DEFINITION" \
                --gallery-image-version "$version"
            done
          else
            echo "No old versions to delete."
          fi
