name: Cleanup Azure Image Gallery

on:
  schedule:
    - cron: "0 5 * * 2"  # Runs every Tuesday at 5 AM UTC
  workflow_dispatch:  # Allows manual execution

jobs:
  cleanup:
    runs-on: self-hosted

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      - name: Run Cleanup Task (PowerShell)
        shell: pwsh
        run: |
          # Define variables directly inside the script
          $resourceGroup = "rg-packer-acg"
          $galleryName = "AzurepackerImages"
          $imageDefinition = "linux8x64"
          $safeDays = 70   # Retain images for 70 days after publishing
          $maxRetentionDays = 735   # Delete images older than 735 days

          Write-Output "Fetching image versions from Azure Image Gallery..."

          # Fetch image versions from Azure
          $imageVersions = az sig image-version list `
              --resource-group $resourceGroup `
              --gallery-name $galleryName `
              --gallery-image-definition $imageDefinition `
              --query "[].{version:name, createdTime:publishingProfile.publishedDate}" `
              --output json | ConvertFrom-Json

          $currentDate = Get-Date
          $thresholdDelete = $currentDate.AddDays(-$safeDays)
          $thresholdMaxDelete = $currentDate.AddDays(-$maxRetentionDays)

          Write-Output "Images published within the last $safeDays days are safe."
          Write-Output "Checking for images older than $maxRetentionDays days (Before: $thresholdMaxDelete)..."

          # Sort images by creation date (latest first)
          $imageVersions = $imageVersions | Sort-Object -Property createdTime -Descending

          # Keep the two most recent images (N & N-1)
          $latestImages = $imageVersions[0..1]

          foreach ($image in $imageVersions) {
              $imageVersion = $image.version
              $createdDate = [datetime]$image.createdTime

              # Skip the latest two versions
              if ($latestImages -contains $image) {
                  Write-Output "Skipping latest retained version: $imageVersion (Created: $createdDate)"
                  continue
              }

              # Ensure images published within the last 70 days are not deleted
              if ($createdDate -gt $thresholdDelete) {
                  Write-Output "Keeping image version: $imageVersion (Created: $createdDate) - Within 70 days"
                  continue
              }

              # Delete images older than 735 days
              if ($createdDate -lt $thresholdMaxDelete) {
                  Write-Output "Deleting image version: $imageVersion (Created: $createdDate) - Exceeds 735 days retention"
                  az sig image-version delete `
                      --resource-group $resourceGroup `
                      --gallery-name $galleryName `
                      --gallery-image-definition $imageDefinition `
                      --gallery-image-version $imageVersion
              } else {
                  Write-Output "Keeping image version: $imageVersion (Created: $createdDate) - Within retention period"
              }
          }

          Write-Output "Image cleanup completed."
