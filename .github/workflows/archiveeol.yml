name: Archive Expired Image Versions

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  archive-image:
    runs-on: self-hosted


    env:
      IMAGE_GALLERY: "AzurepackerImages"
      RESOURCE_GROUP: "rg-packer-acg"
      IMAGE_DEFINITION: "win2019dcx64"
     
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}


      - name: Archive Expired Image Versions
        shell: pwsh
        run: |
            $resourceGroup = "${{ env.RESOURCE_GROUP }}"
            $galleryName = "${{ env.IMAGE_GALLERY }}"
            $imageDefinition = "${{ env.IMAGE_DEFINITION }}"
  
            # Get current date in UTC format
            $currentDate = Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ"
  
            # Get all image versions
            $imageVersions = az sig image-version list --resource-group $resourceGroup --gallery-name $galleryName --gallery-image-definition $imageDefinition --query "[].name" -o tsv
  
            foreach ($version in $imageVersions) {
                $version = $version.Trim()  # Ensure there are no extra spaces
  
                # Get End of Life Date
                $endOfLifeDate = az sig image-version show --resource-group $resourceGroup --gallery-name $galleryName --gallery-image-definition $imageDefinition --gallery-image-version "$version" --query "endOfLifeDate" -o tsv
  
                if ($endOfLifeDate -ne "" -and $endOfLifeDate -lt $currentDate) {
                    Write-Output "Archiving image version: $version of $imageDefinition"
  
                    # Get existing tags as a JSON string
                    $existingTagsJson = az sig image-version show --resource-group $resourceGroup --gallery-name $galleryName --gallery-image-definition $imageDefinition --gallery-image-version "$version" --query "tags" -o json
  
                    # Debugging Output
                    Write-Output "Debug: Existing Tags JSON -> $existingTagsJson"
  
                    # Handle null, empty, or array-type response
                    if ($existingTagsJson -eq "null" -or [string]::IsNullOrEmpty($existingTagsJson)) {
                        $existingTags = @{}
                    } elseif ($existingTagsJson -match "^\[.*\]$") {
                        # If the response is an array, extract the first element
                        $existingTags = ($existingTagsJson | ConvertFrom-Json)[0]
                    } else {
                        $existingTags = ConvertFrom-Json $existingTagsJson
                    }
  
                    # Ensure $existingTags is a hashtable (dictionary)
                    if ($existingTags -isnot [Hashtable]) {
                        $existingTags = @{}
                    }
  
                    # Add or update the "status" tag to "archived"
                    $existingTags["status"] = "archived"
  
                    # Convert tags back to JSON format for Azure CLI
                    $updatedTagsJson = ($existingTags | ConvertTo-Json -Compress -Depth 3)
  
                    # Apply the updated tags
                    az sig image-version update --resource-group $resourceGroup --gallery-name $galleryName --gallery-image-definition $imageDefinition --gallery-image-version "$version" --set tags="$updatedTagsJson"
                }
            }
  