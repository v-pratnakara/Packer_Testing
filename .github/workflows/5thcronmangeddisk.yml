name: cron5th of month Archive Old Azure Images to Managed Disks

on:
  schedule:
    - cron: "0 0 5 * *"  # Runs at midnight UTC on the 5th of every month
  workflow_dispatch:  # Allows manual trigger

env:
  AZURE_SUBSCRIPTION_ID: "1901eaa9-e98f-49b6-ac39-b1cd55defe19"
  SOURCE_RESOURCE_GROUP: "rg-packer-acg"
  DESTINATION_RESOURCE_GROUP: "Test_VM"
  GALLERY_NAME: "AzurepackerImages"
  IMAGE_DEFINITION: "win2019dcx64"
  LOCATION: "West US"

permissions:
  id-token: write
  contents: read

jobs:
  archive-old-images:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      - name: Get and Filter Old Image Versions
        shell: pwsh
        run: |
          # Get current date in the required format
          $CURRENT_DATE = Get-Date
          $CUT_OFF_DATE = $CURRENT_DATE.AddDays(-70).ToString("yyyy-MM-dd")
          
          # Fetch image versions with creation dates
          $IMAGE_VERSIONS = az sig image-version list `
            --resource-group $env:SOURCE_RESOURCE_GROUP `
            --gallery-name $env:GALLERY_NAME `
            --gallery-image-definition $env:IMAGE_DEFINITION `
            --query "[?publishingProfile.publishedDate<'$CUT_OFF_DATE'].name" -o tsv

          if (-not $IMAGE_VERSIONS) {
            Write-Output "No old image versions found!"
            exit 0
          }

          # Ensure each version is separated correctly
          $IMAGE_VERSIONS = $IMAGE_VERSIONS -split "\s+"
          
          # Store image versions in GitHub Actions environment
          Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_VERSIONS=$($IMAGE_VERSIONS -join ',')"

          Write-Output "Found Old Image Versions:"
          $IMAGE_VERSIONS | ForEach-Object { Write-Output $_ }

      - name: Create Managed Disks for Old Image Versions
        shell: pwsh
        run: |
          # Retrieve image versions from environment
          $IMAGE_VERSIONS = $env:IMAGE_VERSIONS -split ","

          foreach ($IMAGE_VERSION in $IMAGE_VERSIONS) {
            # Ensure disk name is valid (remove special characters)
            $DISK_NAME = "ManagedDisk-$($IMAGE_VERSION -replace '[^a-zA-Z0-9]', '-')"
            Write-Output "Creating Managed Disk for image version: $IMAGE_VERSION"

            az disk create `
              --resource-group $env:DESTINATION_RESOURCE_GROUP `
              --name $DISK_NAME `
              --location $env:LOCATION `
              --gallery-image-reference "/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:SOURCE_RESOURCE_GROUP/providers/Microsoft.Compute/galleries/$env:GALLERY_NAME/images/$env:IMAGE_DEFINITION/versions/$IMAGE_VERSION"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create disk for $IMAGE_VERSION"
              exit 1
            }
          }
