name: Export SIG Image Versions to Managed Disks

on:
  workflow_dispatch:  # Allows manual trigger

env:
  AZURE_SUBSCRIPTION_ID: "your-subscription-id"
  SOURCE_RESOURCE_GROUP: "rg-packer-acg"
  DESTINATION_RESOURCE_GROUP: "Test_VM"
  GALLERY_NAME: "AzurepackerImages"
  IMAGE_DEFINITION: "linux8x64"
  LOCATION: "West US"

permissions:
     id-token: write
     contents: read

jobs:
  export-sig-images:
    runs-on: self-hosted
    steps:

      # Step 1: Login to Azure
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      # Step 2: Get Image Versions from SIG
      - name: Get Image Versions
        id: get-versions
        run: |
          IMAGE_VERSIONS=$(az sig image-version list \
            --resource-group $SOURCE_RESOURCE_GROUP \
            --gallery-name $GALLERY_NAME \
            --gallery-image-definition $IMAGE_DEFINITION \
            --query "[].name" -o tsv)
          echo "IMAGE_VERSIONS=$IMAGE_VERSIONS" >> $GITHUB_ENV

      # Step 3: Create Managed Disks for Each Image Version
      - name: Create Managed Disks
        run: |
          for IMAGE_VERSION in $IMAGE_VERSIONS; do
            DISK_NAME="ManagedDisk-$IMAGE_VERSION"
            echo "Creating Managed Disk from $IMAGE_VERSION..."
            
            az disk create \
              --resource-group $DESTINATION_RESOURCE_GROUP \
              --name $DISK_NAME \
              --location $LOCATION \
              --gallery-image-reference "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$SOURCE_RESOURCE_GROUP/providers/Microsoft.Compute/galleries/$GALLERY_NAME/images/$IMAGE_DEFINITION/versions/$IMAGE_VERSION"
          done

      # Step 4: Move Managed Disks to Another Resource Group
      - name: Move Managed Disks
        run: |
          DISK_IDS=$(az disk list --resource-group $DESTINATION_RESOURCE_GROUP --query "[].id" -o tsv)
          
          if [ -n "$DISK_IDS" ]; then
            echo "Moving Managed Disks to Resource Group: $DESTINATION_RESOURCE_GROUP..."
            az resource move --destination-group $DESTINATION_RESOURCE_GROUP --ids $DISK_IDS
          else
            echo "No disks found to move."
          fi
