name: Move Old Azure Images to archive ASIG

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  move-images:
    runs-on: self-hosted

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Authenticate to Azure
      uses: azure/login@v2
      with:
        auth-type: IDENTITY
        client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

    - name: Move the last two oldest image versions to Archive SIG
      shell: pwsh
      run: |
          # Set Azure Subscription and Resource Group
          $SubscriptionId = "1901eaa9-e98f-49b6-ac39-b1cd55defe19"
          $SourceResourceGroup = "rg-packer-acg"
          $SourceSIG = "AzurepackerImages"
          $SourceImageDef = "win2019x64-repave"

          $TargetResourceGroup = "rg-packer-acg"
          $TargetSIG = "AzurepackerImages"
          $TargetImageDef = "win2019x64-archive"
          $Location = "eastus"

          # Authenticate and set subscription
          az account set --subscription $SubscriptionId

          # Get the last two oldest image versions from the source SIG
          $ImageVersions = az sig image-version list --resource-group $SourceResourceGroup `
              --gallery-name $SourceSIG --gallery-image-definition $SourceImageDef `
              --query "sort_by([].{name:name, createdTime:publishingProfile.publishedDate}, &createdTime)[].name" -o tsv `
              | Select-Object -First 2

          # Loop through each image version
          foreach ($ImageVersion in $ImageVersions) {
              Write-Host "🔹 Fetching Managed Image for $ImageVersion..."

              # Get the managed image ID associated with this version
              $ManagedImageId = az sig image-version show --resource-group $SourceResourceGroup `
                  --gallery-name $SourceSIG --gallery-image-definition $SourceImageDef `
                  --gallery-image-version $ImageVersion --query "publishingProfile.source.id" -o tsv

              if (-not $ManagedImageId) {
                  Write-Host "❌ No managed image found for version $ImageVersion, skipping..."
                  continue
              }

              Write-Host "🔹 Creating Archived Image Version: $ImageVersion..."

              # Create the new image version in the Archive SIG
              az sig image-version create --subscription $SubscriptionId `
                  --resource-group $TargetResourceGroup `
                  --gallery-name $TargetSIG `
                  --gallery-image-definition $TargetImageDef `
                  --gallery-image-version $ImageVersion `
                  --managed-image $ManagedImageId `
                  --location $Location `
                  --target-regions eastus=1 `
                  --storage-account-type Standard_LRS

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "❌ Failed to copy Image Version: $ImageVersion"
                  exit 1
              }

              Write-Host "✅ Successfully moved $ImageVersion to Archive SIG."
          }

          Write-Host "🎉 Archive process completed successfully!"

    - name: Notify on Failure
      if: failure()
      run: echo "❌ Image archival process failed!"  