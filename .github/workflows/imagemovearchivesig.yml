name: Move Old Azure Images to archive ASIG

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  move-images:
    runs-on: self-hosted

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Authenticate to Azure
      uses: azure/login@v2
      with:
        auth-type: IDENTITY
        client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

    - name: Move the last two oldest image versions to Archive SIG
      shell: pwsh
      run: |
          # Set Azure Subscription ID
          $SUBSCRIPTION_ID = "1901eaa9-e98f-49b6-ac39-b1cd55defe19"

          # Source (win2019 SIG)
          $SOURCE_RG = "rg-packer-acg"
          $SOURCE_SIG = "AzurepackerImages"
          $SOURCE_IMAGE_DEF = "win2019x64-repave"

          # Target (Archive SIG)
          $TARGET_RG = "rg-packer-acg"
          $TARGET_SIG = "AzurepackerImages"
          $TARGET_IMAGE_DEF = "win2019x64-archive"

          # Fetch the oldest two image versions
          $imageVersions = az sig image-version list --resource-group $SOURCE_RG `
            --gallery-name $SOURCE_SIG --gallery-image-definition $SOURCE_IMAGE_DEF `
            --query "sort_by([].{name:name, createdTime:publishingProfile.publishedDate}, &createdTime)[].name" -o tsv |
            Select-String -Pattern '.*' | Select-Object -First 2

          if ($imageVersions.Count -lt 2) {
              Write-Host "Less than two image versions found. Skipping archival."
              exit 0
          }

          foreach ($IMAGE_VERSION in $imageVersions) {
              Write-Host "Moving Image Version: $IMAGE_VERSION from $SOURCE_SIG to $TARGET_SIG..."

              az sig image-version create --subscription $SUBSCRIPTION_ID `
                  --resource-group $TARGET_RG `
                  --gallery-name $TARGET_SIG `
                  --gallery-image-definition $TARGET_IMAGE_DEF `
                  --gallery-image-version $IMAGE_VERSION `
                  --source "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$SOURCE_RG/providers/Microsoft.Compute/galleries/$SOURCE_SIG/images/$SOURCE_IMAGE_DEF/versions/$IMAGE_VERSION"

              # Verify Copy
              Write-Host "Verifying copied image version $IMAGE_VERSION..."
              $verify = az sig image-version show --subscription $SUBSCRIPTION_ID `
                  --resource-group $TARGET_RG `
                  --gallery-name $TARGET_SIG `
                  --gallery-image-definition $TARGET_IMAGE_DEF `
                  --gallery-image-version $IMAGE_VERSION `
                  --query "id" -o tsv

              if ($verify) {
                  Write-Host "✅ Successfully copied Image Version: $IMAGE_VERSION"

                  # Optional: Delete Source Image Version after successful copy
                  # Write-Host "Deleting old image version from Production SIG..."
                  # az sig image-version delete --subscription $SUBSCRIPTION_ID `
                  #     --resource-group $SOURCE_RG `
                  #     --gallery-name $SOURCE_SIG `
                  #     --gallery-image-definition $SOURCE_IMAGE_DEF `
                  #     --gallery-image-version $IMAGE_VERSION
                  # Write-Host "Deleted Image Version: $IMAGE_VERSION from Production SIG."
              } else {
                  Write-Host "Failed to copy Image Version: $IMAGE_VERSION"
              }
          }

          Write-Host "Archive process completed for the last two oldest image versions!"
