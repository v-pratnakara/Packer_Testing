name: N-2 Maintain Latest 2 SIG Images and Convert Older to Managed Disks

on:
 schedule:
    - cron: "0 0 */3 * *"  # Runs every 3 days at midnight UTC
 workflow_dispatch:  # Allows manual trigger

env:
  AZURE_SUBSCRIPTION_ID: "1901eaa9-e98f-49b6-ac39-b1cd55defe19"
  SOURCE_RESOURCE_GROUP: "rg-packer-acg"
  DESTINATION_RESOURCE_GROUP: "Test_VM"
  GALLERY_NAME: "AzurepackerImages"
  IMAGE_DEFINITION: "win2019dcx64"
  LOCATION: "West US"

permissions:
  id-token: write
  contents: read

jobs:
  manage-sig-images:
    runs-on: self-hosted
    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Authenticate to Azure
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID1 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID1 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID1 }}

      # Step 3: Get Image Versions and Identify Old Ones
      - name: Get Image Versions and Identify Old Ones
        id: get-versions
        shell: pwsh
        run: |
          # Fetch all image versions sorted by published date (latest first)
          $image_versions_json = az sig image-version list `
            --resource-group $env:SOURCE_RESOURCE_GROUP `
            --gallery-name $env:GALLERY_NAME `
            --gallery-image-definition $env:IMAGE_DEFINITION `
            --query "[].{version:name, published:publishingProfile.publishedDate}" `
            --output json | ConvertFrom-Json | Sort-Object -Property published -Descending

          # Ensure we have at least one image
          if ($image_versions_json.Count -lt 1) {
            Write-Error "No image versions found!"
            exit 1
          }

          # Keep only the latest 2 images in SIG
          $latest_versions = $image_versions_json[0..1].version
          $old_versions = $image_versions_json[2..$image_versions_json.Count].version

          # Store the versions in GitHub environment
          $KEEP_VERSIONS = $latest_versions -join ","
          echo "KEEP_VERSIONS=$KEEP_VERSIONS" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Keeping Image Versions: $KEEP_VERSIONS"

          # Store old versions for disk conversion
          if ($old_versions.Count -gt 0) {
            $OLD_VERSIONS = $old_versions -join ","
            echo "OLD_VERSIONS=$OLD_VERSIONS" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Output "Converting Older Versions to Managed Disks: $OLD_VERSIONS"
          } else {
            Write-Output "No old images to convert."
            echo "OLD_VERSIONS=" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # Step 4: Create Managed Disks from Older Images
      - name: Convert Old Images to Managed Disks
        if: env.OLD_VERSIONS != ''
        shell: pwsh
        run: |
          $OLD_VERSIONS = $env:OLD_VERSIONS -split ","

          foreach ($IMAGE_VERSION in $OLD_VERSIONS) {
            if ([string]::IsNullOrEmpty($IMAGE_VERSION)) {
              Write-Output "Skipping empty image version entry."
              continue
            }

            # Sanitize disk name
            $DISK_NAME = "ManagedDisk-$($IMAGE_VERSION -replace '[^a-zA-Z0-9-]', '-')"

            Write-Output "Creating Managed Disk for image version: $IMAGE_VERSION"
            Write-Output "Sanitized Disk Name: $DISK_NAME"

            # Create the managed disk
            az disk create `
              --resource-group $env:DESTINATION_RESOURCE_GROUP `
              --name $DISK_NAME `
              --location $env:LOCATION `
              --gallery-image-reference "/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:SOURCE_RESOURCE_GROUP/providers/Microsoft.Compute/galleries/$env:GALLERY_NAME/images/$env:IMAGE_DEFINITION/versions/$IMAGE_VERSION"

            # Check if the command succeeded
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create disk for $IMAGE_VERSION"
              exit 1
            }
          }

      
